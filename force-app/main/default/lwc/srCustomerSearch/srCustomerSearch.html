<template>
    <lightning-card title="Tìm kiếm khách hàng, đơn hàng, yêu cầu" icon-name="standard:search">
        <div class="slds-p-horizontal_medium">
            <lightning-input
                type="search"
                label="Nhập SĐT, tên khách, số đơn hoặc mã yêu cầu (từ 3 ký tự)"
                value={term}
                onchange={handleChange}
            ></lightning-input>

            <template lwc:if={isLoading}>
                <lightning-spinner alternative-text="Đang tìm" size="small"></lightning-spinner>
            </template>
            <template lwc:if={errorMessage}>
                <p class="slds-text-color_error slds-m-top_small">{errorMessage}</p>
            </template>

            <template for:each={groups} for:item="g">
                <div key={g.objectName} class="slds-m-top_medium">
                    <h3 class="slds-text-heading_small slds-m-bottom_x-small">{g.title} ({g.count})</h3>
                    <template lwc:if={g.hasRows}>
                        <lightning-datatable
                            key-field="Id"
                            data={g.rows}
                            columns={g.columns}
                            hide-checkbox-column
                            onrowaction={handleRowAction}
                        ></lightning-datatable>
                    </template>
                    <template lwc:else>
                        <p class="slds-text-color_weak">Không có kết quả</p>
                    </template>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
